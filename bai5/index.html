<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .khoi-1{
            background-color: red;
            display: flex;
            justify-content: flex-end;
            /*justify-content: Đi theo chiều ngang*/
            /*flex-start: Đi sang trái*/
            /*flex-end: Đi sang phải*/
            /*center: Ở giữa*/
            /*space-between: Cách đều 2 đầu*/
            /*space-around: Cách đều nhau*/
            /* align-items: Đi theo chiều dọc */
            /*flex-start: Đi lên trên*/
            /*flex-end: Đi xuống dưới*/
            /*center: Ở giữa*/
        }
        .khoi-2{
            background-color: blue;
            /*margin truyền 1 giá trị thì sẽ cách xung quanh = giá trị dó*/
            /*2 giá trị: giá trị đầu (trên,dưới) giá trị sau (trái,phải)*/
            /*4 giá trị: Thứ tự trên,phải,dưới,trái*/
            margin: 10px 50px 100px 200px;
        }
        .khoi-3{
            background-color: yellow;
            padding: 10px 20px 100px 200px;
        }
    </style>

</head>
<body>
   <h1 style="color:blue; background-color:red">Web 1</h1>

   <!-- Nếu là id sd dấu # + tên id -->
   <!-- ví dụ ở dưới: #tieude-1 -->
   <h2 id="tieude-1">Web 2</h2>

   <!-- Nếu là class sd dấu . + tên class -->
   <!-- ví dụ ở dưới: .tieude-2 -->
   <h3 class="tieude-2">Web 3</h3>
   <div>Web 4</div>
   <div class="Web4">Web 4</div>

   

   <h1>Margin</h1>

   <div class="khoi-1">Khối 1</div>
   <div class="khoi-2">Khối 2</div>
   <div class="khoi-3">Khối 3</div>


   
</body>
</html>
