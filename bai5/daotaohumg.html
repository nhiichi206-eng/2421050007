<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao tao HUMG</title>
    <style>
        body{
            
        }
        .menu{
            background-color: blue;
        }
        .danh-sach-muc{
            /*bỏ dấu chấm của list*/
            list-style: none;
            margin:auto;
            display: flex;
        }
        .muc{
            color:white;
            /*font-weight:blod;*/
            /*background-color: red;*/
            padding: 15px;
        }
        a{
            color:white;
            /*để bỏ gạch chân của thẻ a dùng text-decoration*/
            text-decoration: none;
        }
        main{
            display: flex;
        }
        .khoi-trai{
            width: 20%;
            height:500px;
        }
        .khoi-phai{
            background-color: green;
            width: 80%;
            height:500px;
        }
        .dang-nhap{
            background-color: gray;
            height: 200px;
            display:flex;
            justify-content: center;
        }
        p{
            margin:0;
        }

    </style>
</head>
<body>
    <!-- Danh mục -->
    <nav class="menu">
        <ul class="danh-sach-muc">
             <li class="muc"><a href="#">Thực tập, Đồ án</a></li>
             <li class="muc"><a href="#">Thủ tục một cửa</a></li>
             <li class="muc"><a href="#">Một cửa online</a></li>
             <li class="muc"><a href="#">E-mail HUMG</a></li>
        </ul>
    </nav>
    <!-- Nội dung chính -->
     <main>
        <div class="khoi-trai">
            <div class="dang-nhap">
                <form action>
                    <p>Tài khoản:</p>
                    <input type="text">
                    <p>Mật khẩu:</p>
                    <input type="password">
                </form>
            </div>
        </div>
        <div class="khoi-phai">Phải</div>
     </main>
    
</body>
</html>
