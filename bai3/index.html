<html>
    <head>
        <title>Bài 3</title>
    </head>
    <body>
        <MARQUEE>
            <!-- MARQUEE: Hiệu ứng cuộn chữ, ảnh -->
            <img src="../anh/kazuha.png">
        </MARQUEE>
       <!-- ol: Danh sách có thứ tự -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>

        <!-- ul: Danh sách không có thứ tự -->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>

        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên:</b><br>
                <!-- Nếu input k có type thì sẽ mặc định là text -->
                <!-- Thuộc tính readonly: sử dụng khi k muốn người dùng nhập thông tin vào input -->
                <!-- placeholder: Văn bản gợi ý trong ô input -->
                <input type="text" placeholder="Họ và tên">
            </div>

            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>

            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>

            <div>
                <!-- textarea: Ô nhập văn bản nhiều dòng -->
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>

            <div>
                <b>Email</b><br>
                <input type="email" placeholder="Email">
            </div>

            <div>
                <!-- Số đầu tiên: 0 -->
                <!-- Số thứ 2: 3, 8, 9-->
                <!-- 8 số còn lại: 0-9 -->
                <b>Số điện thoại</b><br>
                <input type="tel" pattern="([0]{1}([3,8,9]{1})([0-9]{8}))">
            </div>

            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam"> Nam <br>
                <input type="radio" name="gioitinh" value="nu"> Nữ
            </div>
            
            <div>
                <!-- checkbox:tích đc nhiều lựa chọn -->
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="choigame"><br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="nghenhac"><br>
                Thể thao: <input type="checkbox" name="sothich" value="thethao"><br>
            </div>

            <div>
                <b>Trình duyệt web ưa thích</b><br>
                <select name="browsers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Chrome">Chrome</option>
                    <option value="Opera">Opera</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc cốc">Cốc cốc</option>
                </select>
            </div>
             0 <input type="range" id="a" value="50"> 100

             <div>
                
             </div>
            <div>
                <!-- submit: nộp -->
                <!-- reset: xóa, đặt lại -->
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>

            <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/L5h-5CUunYI?si=Mz_qVZV9XCMh-Ny9"></iframe>

            <div>
                <video controls width="560" height="315">
                    <source src="/anh/rongnho.mp4" type="video/mp4">
                </video>

                <audio controls>
                    <source src="/anh/âm thanh nhẹ.mp3" type="audio/mp3">
                </audio>

            </div>
        </form>
    </body>
</html>
