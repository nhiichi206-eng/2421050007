<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - JavaScript</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        //Có thể thêm mã nguồn html vào trong JS
        //Lưu ý: html phải đặt trong dấu " "
        document.writeln("Hello <br> World!");

        var tenSinhVien = "Ngọc Nhi";
        var tuoi = 20;
        document.writeln(tenSinhVien + "<br>" + tuoi + "<br>");

        var soThuNhat = 10;
        var soThuHai = 5;
        // + - * /
        // % chia lấy phần dư
        var ketQua = soThuNhat + soThuHai;
        document.writeln("Kết quả là " + ketQua);

        var ketQua = soThuNhat * soThuHai;
        document.writeln("Kết quả là " + ketQua);

        // ++ --
        document.writeln(++soThuNhat);
        document.writeln(--soThuNhat);

        // += -= *= /= %=
        //Tương đương: soThuNhat = soThuNhat + soThuHai
        soThuNhat+=soThuHai
        document.writeln(soThuNhat);

        //Kiểu dữ liệu
        //string
        //Number Số
        //boolean (true/false)

        var a = "10";
        var b = "5";
        //Chuyển string => number dùng: parseInt()
        var tong = parseInt(a) + parseInt(b);
        document.writeln(tong);

        var a = "10";
        var b = "5.5";
        //Chuyển string => số thực dùng: parseFloat()
        var tong = parseInt(a) + parseFloat(b);
        document.writeln(tong);

        //String
        document.writeln("<br>");
        //Kiểm tra độ dài chuỗi length
        document.writeln(tenSinhVien.length);

        //Nối chuỗi +

        //Kiểm tra tồn tại
        //indexOf: Tìm vị trí xuất hiện đầu tiên (có - vị trí/ k có -1)
        document.writeln("<br>");
        document.writeln(tenSinhVien.indexOf("i"));

        //includes: Kiểm tra xem từ có trong chuỗi không? Có = True / Không = False
        document.writeln("<br>");
        document.writeln(tenSinhVien.includes("n"));

        //replace (thay thế chuỗi)
        document.writeln("<br>");
        document.writeln(tenSinhVien.replace("Ngọc", "Thanh"));
        tenSinhVien = tenSinhVien.replace("Ngọc", "Thanh");
        document.writeln(tenSinhVien)

        //Kiểm tra ký tự bắt đầu
        //StartsWith
        document.writeln("<br>");
        document.writeln(tenSinhVien.startsWith("Ngọc"));

        //Viết in hoa
        document.writeln("<br>");
        document.writeln(tenSinhVien.toUpperCase());

        //Viết thường 
        document.writeln("<br>");
        document.writeln(tenSinhVien.toLowerCase());

        //Number
        //Kiểm tra dữ liệu có phải số hay không?
        //var a = "10";
        //var so = 20;

        //var kq = isNaN();
        //document.writeln();
        var kq = typeof(so);
        document.writeln();

        //Date
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        //tháng/ngày/năm
        var ngay = new Date("10/20/2026");
        document.writeln("<br>");
        document.writeln(ngay);

        //Lấy năm
        var nam = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(nam);

        //Lấy tháng
        var thang = homNay.getMonth() + 1;
        document.writeln("<br>");
        document.writeln(thang);

        //Lấy ngày
        var ngay = homNay.getDate();
        document.writeln("<br>");   
        document.writeln(ngay);

        //Lấy thứ
        var thu = homNay.getDay();
        document.writeln("<br>");
        document.writeln(thu);

        var namSinhNhi = nam - tuoi;
        document.writeln("<br>");
        document.writeln("Nhi sinh năm " + namSinhNhi);

        //Mảng (array): thứ tự 0 1 2 3 4 ....
        var mangSo = [1, 2, 3, 4, 5];
        var mangTen = ["Ánh", "Nhi", "Thảo"];
        var thongTin = ["Nhi", 20, false];

        document.writeln("<br>");
        document.writeln(mangSo[2]);

        document.writeln("<br>");
        document.writeln(mangTen[1]);

        document.writeln("<br>");
        document.writeln(thongTin[0]);  

        //Kiểm tra mảng length
        document.writeln("<br>");
        document.writeln(mangSo.length);

        //Gộp mảng: concat
        var mang = mangSo.concat(mangTen, thongTin);
        document.writeln(mang);
        
        //join
        document.writeln("<br>");
        document.writeln(mangSo.join("-"));

        //pop: Lấy ra số cuối cùng
        document.writeln("<br>");
        document.writeln(mangSo.pop());

        //push: Thêm phần tử vào cuối mảng
        document.writeln("<br>");
        mangSo.push(6);
        document.writeln(mangSo);

        //reverse: Đảo ngược mảng
        document.writeln("<br>");
        document.writeln(mangSo.reverse());

        //var soThuNhat = 10;
        //var soThuHai = 5;
        // == : So sánh =
        // != : So sánh khác
        // >  : Lớn hơn
        // <  : Nhỏ hơn
        // >= :  Lớn hơn hoặc bằng
        // <= : Nhỏ hơn hoặc bằng
        document.writeln("<br>");
        document.writeln(soThuNhat == soThuHai);

        document.writeln("<br>");
        document.writeln(soThuNhat != soThuHai);

        document.writeln("<br>");
        document.writeln(soThuNhat > soThuHai);

        document.writeln("<br>");
        document.writeln(soThuNhat < soThuHai);

        document.writeln("<br>");
        document.writeln(soThuNhat);
        document.writeln(soThuNhat >= 11);

        document.writeln("<br>");
        document.writeln(soThuNhat);
        document.writeln(soThuNhat <= 14);

        //var soThuNhat = 15;
        //var soThuHai = 5;
        var c = "10";
        var d = "5.5";
        // && : Và  || : Hoặc
        //True && True = True
        //True && False = False
        //False && False = False
        document.writeln("<br>");
        document.writeln(soThuNhat > soThuHai) && (c < d);

        //True || False = True
        document.writeln("<br>");
        document.writeln(soThuNhat > soThuHai) || (c < d);

        //var thu = homNay.getDay();
        document.writeln(thu);
        if (thu == 5) {
            document.writeln("Hôm nay là thứ 6");
        } 
        else{
            document.writeln("Hôm nay không phải là thứ 6");
        }

        //
        document.writeln(thu);
        if (thu == 0) {
            document.writeln("Hôm nay là chủ nhật");
        } 
        else{
            document.writeln("Hôm nay không phải là chủ nhật");
        }

        //Ví dụ
        var diem = 8;
        if (diem > 4){
            document.writeln("Đã qua môn");
        }
        else{
            document.writeln("Chưa qua môn");
        }

        //0 -> 4 F
        //4 -> 5 D
        //5 -> 7 C
        //7 -> 8 B
        //8 -> 10 A
        var diem = 7;
        if (diem > 0 && diem < 4){
            document.writeln("F");
        }
        else if (diem >= 4 && diem < 5){
            document.writeln("D");
        }
        else if (diem >= 5 && diem < 7){
            document.writeln("C");
        }
        else if (diem >= 7 && diem < 8){
            document.writeln("B");
        }
        else if (diem >= 8 && diem < 10){
            document.writeln("A");
        }
        else{
            document.writeln("Điểm không hợp lệ");
        }

        //object: var name = {}
        var thongTinSinhVien = {
            hoTen: "Nguyen Thi Ngoc Nhi",
            tuoi: 20,
            gioiTinh: "False", //True: Nam / False: Nữ
            diaChi: {
                thanhPho: "Ha Noi",
                phuong: "Dong Ngac",
                duong: "Le Van Hien"
            }
        }

        var thongTinPhim = {
            theLoai: "Hoat hinh",
            tenPhim: "Doraemon",
            tacGia: "Fujiko F. Fujio",
            nhanVat: {
                nhanVatChinh: [
                    "Doraemon", "Nobita", "Shizuka", "Suneo", "Jaian"
                ],
                nhanVatPhu: [
                    "Dorami", "Dekisugi", "Tamako"
                ]
            },
            namSangTac: 1969,  
        }

        document.writeln("<br>");
        document.writeln(thongTinPhim.tacGia);
        document.writeln("<br>");
        document.writeln(thongTinPhim.nhanVat.nhanVatChinh[2]);

        //switch case
        var d = new Date();
        var theDay = d.getDay();
        switch (theDay) {
            case 5:
                document.writeln("Finally Friday");
                break;
            case 6:
                document.writeln("Super Saturday");
                break;
            case 0:
                document.writeln("Sleep Sunday");
                break;
            default:
                document.writeln("I'm looking forward to this weekend!");
            }

            //vòng lặp for
            for (var index = 1; index <= 3; index++) {
                document.writeln("<br> Xin chào! " + index);
            }

            var danhSachSinhVien = ["Thuy", "Mai", "Tuan", "Thang", "Thao"];
            document.writeln("<br> Xin chào!" + danhSachSinhVien[0]);
            for (var i = 0; i < danhSachSinhVien.length; i++){
                document.writeln("<br>" + i + "<br>");
                document.writeln("Xin chào " + danhSachSinhVien[i]);
            }
            
            var danhSachSinhVien = ["Thuy", "Mai", "Tuan", "Thang", "Thao"];
            for (var i = 0; i < danhSachSinhVien.length; i++){
                if(danhSachSinhVien[i] == "Thuy" || danhSachSinhVien[i] == "Tuan"){
                    document.writeln("Xin chào" + danhSachSinhVien[i] )
                }
            }
    </script>

    <!-- external JS -->

</body>
</html>
